<!DOCTYPE html>
<html lang="ko" data-app="workout">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘의 운동</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 체육관 화이트보드처럼 짧고 단호하게, 손에 쥐고 쓰는 도구
   IDEA: 원판 색 띠가 둘린 운동 일지 카드 한 장
   PICTURE: 오늘 할 운동 목록 자체 + 동작마다 움직이는 막대인형 자세 영상
   COLOUR and TYPE: 원판 빨강 띠, 흰/먹색 바탕, Black Han Sans + Noto Sans KR
   LAYOUT: 한 열, 엄지로 누르는 세트 버튼, 하단 휴식 타이머 */
:root{color-scheme:light dark;--bg:light-dark(#f3f3f0,#101114);--card:light-dark(#ffffff,#1b1d21);--ink:light-dark(#15161a,#efede8);--mute:light-dark(#6c6f76,#9c9ea5);--line:light-dark(#e2e2dd,#2b2e34);--red:#e2412a;--redink:light-dark(#c4321d,#ff7d63);--equip:light-dark(#d3d3cc,#3b3e45);--plate:light-dark(#2c2e34,#a9abb2);--soft:light-dark(#fbe9e5,#2a1915)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;padding-bottom:96px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.top{background:var(--red);color:#fff;padding:22px 0 18px}
.date{margin:0;font-size:14px;opacity:.9}
h1{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:clamp(34px,9vw,46px);line-height:1.05;margin:6px 0 2px;text-wrap:balance}
.dsub{margin:0 0 14px;font-size:15px;opacity:.92}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;height:44px;border:0;border-radius:10px;background:rgba(255,255,255,.18);color:#fff;font:700 16px "Noto Sans KR",sans-serif;position:relative;cursor:pointer}
.tabs button[aria-pressed=true]{background:#fff;color:var(--red)}
.tabs button.today::after{content:"";position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%;background:currentColor}
.tabs button:focus-visible,.dot:focus-visible,.more:focus-visible,.tb button:focus-visible,input:focus-visible{outline:3px solid #ffd2c8;outline-offset:2px}
.prog{height:8px;background:rgba(255,255,255,.25);border-radius:4px;margin-top:14px;overflow:hidden}
.prog div{height:100%;background:#fff;width:0;transition:width .3s}
.ptext{margin:6px 0 0;font-size:13px;opacity:.92}
.note{margin:16px 0 4px;font-size:14px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card.ok{border-color:var(--red)}
.row1{display:flex;gap:12px;align-items:flex-start}
.no{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--redink);font-weight:700;font-size:14px}
.ok .no{background:var(--red);color:#fff}
.nm h3{margin:2px 0 0;font-size:18px;line-height:1.3}
.nm p{margin:2px 0 0;font-size:14px;color:var(--mute)}
.row2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.wt{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--mute)}
.wt input{width:76px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:16px "Noto Sans KR",sans-serif;text-align:right;padding:0 10px}
.sets{display:flex;flex-wrap:wrap;gap:8px}
.dot{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--mute);font:700 15px "Noto Sans KR",sans-serif;cursor:pointer}
.dot.on{background:var(--red);border-color:var(--red);color:#fff}
.dot.wide{width:auto;border-radius:22px;padding:0 16px}
.more{margin-top:12px;width:100%;height:44px;border:0;border-radius:10px;background:var(--bg);color:var(--ink);font:500 15px "Noto Sans KR",sans-serif;cursor:pointer}
.det{margin-top:12px}
.fig{background:var(--bg);border-radius:12px;position:relative;cursor:pointer}
.fig svg{display:block;width:100%;height:auto;max-height:300px}
.hint{display:block;text-align:right;padding:0 10px 8px;font-size:12px;color:var(--mute)}
.fg line{stroke-linecap:round;stroke-width:7}
.nr{stroke:var(--ink)}.far{stroke:var(--mute);opacity:.5}
.hi{stroke:var(--red)}.far.hi{opacity:.45}
.eq{stroke:var(--equip);stroke-linecap:round}.eqf{fill:var(--equip)}
.pl{fill:var(--plate)}.cb{stroke:var(--mute);stroke-width:1.5;stroke-dasharray:3 3}
dl{margin:12px 0 0}
dt{font-weight:700;font-size:14px;color:var(--redink);margin-top:10px}
dd{margin:2px 0 0;font-size:15px}
.yt{display:flex;align-items:center;justify-content:center;height:44px;margin-top:12px;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px}
.rest{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px 0}
.rest h2{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:26px;margin:0 0 6px}
.rest p{margin:0;color:var(--mute)}
.foot{font-size:14px;color:var(--mute);margin:20px 0}
.foot a{color:var(--redink)}
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.timer .wrap{display:flex;align-items:center;gap:10px;padding:0}
.tl{flex:1}.tl small{display:block;font-size:13px;opacity:.75}
.tl b{font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}
.tb button{height:44px;padding:0 14px;border:0;border-radius:10px;font:700 15px "Noto Sans KR",sans-serif;cursor:pointer;background:var(--bg);color:var(--ink)}
.tb button+button{margin-left:6px;background:var(--red);color:#fff}
.timer.done{background:var(--red);color:#fff}
.remind{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:20px 0 0}
.remind h2{font-size:17px;margin:0 0 4px}.remind p{margin:0 0 12px;font-size:14px;color:var(--mute)}
.rrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw{display:flex;align-items:center;gap:8px;font-size:15px;min-height:44px}.sw input{width:22px;height:22px;accent-color:var(--red)}
.remind input[type=time]{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:16px "Noto Sans KR",sans-serif;padding:0 10px}
.remind button{height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:500 15px "Noto Sans KR",sans-serif}
.watch{width:100%;min-height:52px;margin:12px 0 4px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font:700 16px "Noto Sans KR",sans-serif;cursor:pointer}
.watch.on{background:var(--red);color:#fff}
.wmsg{font-size:13px;color:var(--mute);margin:0 0 4px}
.rmsg{font-size:13px;color:var(--redink);margin-top:8px;min-height:1em}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <p class="date" id="date"></p>
  <h1 id="dtitle">오늘의 운동</h1>
  <p class="dsub" id="dsub"></p>
  <nav class="tabs" id="tabs" aria-label="요일 선택"></nav>
  <div class="prog"><div id="bar"></div></div>
  <p class="ptext" id="ptext"></p>
</div></header>
<main class="wrap" id="list"></main>
<div class="wrap"><section class="remind" id="remind" hidden>
  <h2>매일 운동 알림</h2>
  <p>평일(월~금) 정해진 시간에 그날 운동을 알려드려요. 휴대폰 절전 상태에 따라 몇 분 늦게 올 수 있어요.</p>
  <div class="rrow"><label class="sw"><input type="checkbox" id="ron"> 알림 켜기</label><input type="time" id="rtime" value="18:00" aria-label="알림 시간"><button id="rtest">알림 미리보기</button></div>
  <div class="rmsg" id="rmsg"></div>
</section></div>
<div class="wrap"><p class="foot">무게 올리는 법: 모든 세트에서 정해진 횟수의 최대치를 채우면 다음 회차에 상체 +2.5kg, 하체 +5kg. 첫 2주는 2~3개 더 할 수 있겠다 싶은 무게로 자세부터 익히세요.<br>동작별 자세를 더 자세히 보려면 <a href="https://claude.ai/artifact/6KG8w3SPGEUG9TVYyPtGtr">자세 가이드 문서</a>를 여세요.</p></div>
<div class="timer" id="timer" hidden><div class="wrap">
  <div class="tl"><small id="tlab">휴식</small><b id="tval">0:00</b></div>
  <div class="tb"><button id="tplus">+30초</button><button id="tstop">끝</button></div>
</div></div>
<script>
{
const $=s=>document.querySelector(s);
const AN=window.Android;
/* 앱에서는 기록을 휴대폰 저장소(워치와 공유)에 두고, 예전 기록은 처음 읽을 때 옮겨 온다 */
const store={get(k,d){try{let v=AN?AN.kvGet(k):null;if(v==null){const l=localStorage.getItem(k);if(l!=null){v=l;if(AN)AN.kvSet(k,l)}}return v==null?d:JSON.parse(v)}catch(e){return d}},
set(k,v){const t=JSON.stringify(v);try{if(AN)AN.kvSet(k,t)}catch(e){}try{localStorage.setItem(k,t)}catch(e){}}};
let wmsg='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const X=(n,s,r,rest,m,w,p,c,x)=>({n,s,r,rest,m,w,p,c,x});
const EXT=['무릎을 기구 회전축에 맞추고 패드는 발목 위에 둡니다. 끝까지 펴고 1초 멈춘 뒤 천천히 내립니다.','허벅지 앞쪽이 쥐어짜지는 느낌. 엉덩이는 의자에 붙입니다.','반동으로 차올리면 무릎 앞쪽에 충격이 반복됩니다. 회전축이 어긋나면 무릎에 비틀린 힘이 걸립니다.'];
const STAIR=['상체를 세우고 발 전체로 계단을 딛습니다. 손잡이는 균형용으로 가볍게만.','디딘 발의 뒤꿈치로 밀어 엉덩이를 쓰는 느낌.','손잡이에 기대면 소모 칼로리가 크게 줄고 손목·어깨에 무리가 갑니다. 손을 놓고 못 탈 속도면 낮추세요.'];
const DAYS=[null,
{t:'하체 A',s:'스쿼트 중심',i:[
X('바벨 스쿼트',4,'4세트 × 6~8회',120,'squat',1,'바를 어깨 뒷살에 얹고 발은 어깨너비, 발끝은 살짝 바깥. 엉덩이를 뒤로 빼며 무릎을 발끝 방향으로 굽혀 허벅지가 바닥과 평행할 때까지 앉습니다.','허벅지 앞과 엉덩이. 가슴을 세우고 발 전체로 바닥을 밀며 일어납니다.','무릎이 안으로 모이면 무릎 인대, 뒤꿈치가 뜨면 무릎 앞쪽에 부담. 바닥에서 꼬리뼈가 말리면 허리 디스크에 압력이 갑니다. 안전바는 앉은 높이보다 조금 낮게.'),
X('덤벨 루마니안 데드리프트',3,'3세트 × 10회',90,'hinge',1,'무릎을 살짝만 굽혀 고정하고, 엉덩이를 뒤로 밀며 상체를 숙입니다. 덤벨은 다리에 붙여 정강이 중간까지.','허벅지 뒷면(햄스트링)이 당기는 느낌. 등은 끝까지 일자.','등이 둥글게 말리면 허리 부상의 가장 흔한 원인입니다. 덤벨이 다리에서 멀어지면 허리가 무게를 버팁니다.'),
X('덤벨 워킹 런지',3,'3세트 × 한쪽 10회',90,'lunge',1,'한 발을 크게 내딛고 뒷무릎이 바닥에 닿기 직전까지 내려갑니다. 앞발 뒤꿈치로 밀어 일어나며 다음 발을 내딛습니다.','앞다리의 엉덩이와 허벅지. 상체는 곧게.','보폭이 좁으면 무릎이 발끝을 크게 넘어 무릎에 부담. 앞무릎이 안으로 꺾이면 인대가 비틀립니다.'),
X('레그 익스텐션',3,'3세트 × 12회',60,'legext',1,...EXT),
X('플랭크',3,'3세트 × 30~45초',60,'plank',0,'팔꿈치를 어깨 바로 아래에 두고 머리부터 발뒤꿈치까지 일자. 엉덩이를 조이고 배꼽을 등 쪽으로 당깁니다.','복부 전체와 엉덩이. 숨은 짧고 규칙적으로.','허리가 처지면(영상의 처음 자세) 허리 아래쪽이 무게를 버텨 통증이 생깁니다. 자세가 무너지면 시간이 남아도 멈추세요.'),
X('천국의계단',1,'12분',0,'stair',0,...STAIR)]},
{t:'상체 A',s:'밀기 중심',i:[
X('벤치프레스',4,'4세트 × 6~8회',120,'bench',1,'눈이 바 아래 오게 눕고 어깨보다 조금 넓게 잡습니다. 견갑골을 모아 내리고, 바를 명치 높이로 천천히 내린 뒤 밀어 올립니다.','가슴. 팔꿈치는 몸통과 45~70도.','팔꿈치를 90도로 펼치면 어깨 앞쪽이 끼입니다. 가슴에서 튕기면 흉골에 충격. 혼자면 파워랙 안전바를 가슴 바로 아래에 맞추세요.'),
X('랫풀다운',3,'3세트 × 8~10회',90,'latpull',1,'허벅지 패드로 다리를 고정하고 어깨보다 넓게 잡습니다. 상체를 10~15도 뒤로 기울이고 바를 윗가슴까지 끌어내립니다.','팔꿈치를 옆구리 주머니에 넣는 느낌. 등 옆라인이 당겨집니다.','몸을 크게 젖히면 반동이 됩니다. 목 뒤로 내리면 어깨와 목에 부담. 어깨가 귀로 올라가면 승모근만 뭉칩니다.'),
X('덤벨 숄더프레스',3,'3세트 × 10회',90,'ohp',1,'등받이를 세운 벤치에 앉아 덤벨을 귀 높이에서 머리 위로 밀어 올립니다. 팔꿈치는 몸통보다 살짝 앞.','어깨 앞·옆. 배에 힘을 줘 허리를 고정합니다.','허리를 뒤로 꺾으면 허리 아래쪽에 압력이 갑니다. 너무 깊이 내리면 어깨 관절이 불안정해집니다.'),
X('케이블 시티드 로우',3,'3세트 × 12회',90,'cablerow',1,'도르래를 가장 아래에 두고 앉아 무릎을 살짝 굽힙니다. 상체를 세운 채 손잡이를 배꼽 쪽으로 당깁니다.','당길 때 견갑골을 서로 모으는 느낌.','상체를 앞뒤로 크게 흔들면 허리가 당기고 등은 거의 쓰지 않습니다. 어깨를 으쓱하면 목에 담이 오기 쉽습니다.'),
X('케이블 푸시다운',3,'3세트 × 12회',60,'pushdown',1,'도르래를 가장 위에 두고 팔꿈치를 옆구리에 붙인 채 팔만 아래로 끝까지 폅니다.','팔 뒷면(삼두근). 팔꿈치는 움직이지 않는 축.','팔꿈치가 앞뒤로 움직이거나 상체로 누르면 어깨·가슴이 대신 밀어 삼두근 자극이 줄어듭니다.'),
X('덤벨 컬',3,'3세트 × 12회',60,'curl',1,'팔꿈치를 옆구리에 붙이고 손바닥이 앞을 보게 덤벨을 어깨 쪽으로 올립니다. 내릴 때 거의 끝까지 폅니다.','팔 앞면(이두근). 내리는 구간을 천천히.','몸을 뒤로 젖히며 반동을 쓰면 허리 통증으로 이어질 수 있습니다. 팔꿈치가 앞으로 나오면 어깨가 무게를 나눠 듭니다.'),
X('러닝머신 경사 걷기',1,'12분 · 경사 8~12%',0,'walk',0,'시속 4.5~5.5km에서 상체를 세우고 팔을 자연스럽게 흔듭니다.','뒤꿈치로 디디고 엉덩이로 몸을 밀어내는 느낌.','손잡이를 꽉 잡고 몸을 젖히면 경사 효과와 소모 칼로리가 크게 줄어듭니다.')]},
{t:'유산소 + 코어',s:'인터벌과 지속 유산소',i:[
X('실내 자전거 인터벌',1,'30초 전력 / 90초 천천히 × 8',0,'bikefast',0,'페달이 가장 아래일 때 무릎이 살짝(약 25도) 굽게 안장을 맞춥니다. 상체는 약간 숙이고 팔은 힘을 뺍니다.','30초 구간은 숨이 찰 만큼 정말 힘들어야 효과가 있습니다.','안장이 낮으면 무릎 앞쪽, 높으면 골반이 좌우로 흔들려 허리가 아픕니다.'),
X('천국의계단 지속',1,'20분',0,'stair',0,'대화는 가능하지만 노래는 못 부를 속도를 20분 유지합니다.','손잡이 없이 바른 자세로 일정한 리듬.','처음에 속도를 올렸다가 10분 만에 지치면 지방 연소 시간이 짧아집니다.'),

  if(pr.includes('db'))front+=`<circle cx="${W1[0].toFixed(1)}" cy="${W1[1].toFixed(1)}" r="7" class="pl"/>`;
  if(pr.includes('grip'))front+=`<circle cx="${W1[0].toFixed(1)}" cy="${W1[1].toFixed(1)}" r="4.5" class="pl"/>`;
  return back+ln(H,K2,c('th',1))+ln(K2,A2,c('sh',1))+ln(A2,T2,'far',5)+ln(S,E2,c('ua',1))+ln(E2,W2,c('fa',1))
   +ln(H,S,c('t'),9)+`<circle cx="${Hd[0].toFixed(1)}" cy="${Hd[1].toFixed(1)}" r="${(11*(P.sc||1)).toFixed(1)}" fill="var(--ink)"/>`
   +ln(H,K1,c('th'))+ln(K1,A1,c('sh'))+ln(A1,T1,'nr',5)+ln(S,E1,c('ua'))+ln(E1,W1,c('fa'))+front}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const paused=new Set(),t0=performance.now();
function frame(now){
  for(const s of document.querySelectorAll('svg[data-m]')){
    const P=PAT[s.dataset.m];if(!P)continue;
    const id=s.dataset.id,still=paused.has(id)||(reduce&&!s.dataset.play);
    const t=still?0.25:((now-t0)%(P.dur||2400))/(P.dur||2400);
    const p1=ease(t),p2=ease((t+(P.ph||0))%1);
    s.innerHTML='<g class="fg">'+(P.view==='front'?drawFront(P,p1):drawSide(P,p1,p2))+'</g>'}
  requestAnimationFrame(frame)}

/* ---------- 화면 ---------- */
const now=new Date(),wd=now.getDay(),dkey=`${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`;
const WD=['일','월','화','수','목','금','토'];
let sel=wd>=1&&wd<=5?wd:0;const open=new Set();
const fmt=s=>s>=60?`${Math.floor(s/60)}분${s%60?` ${s%60}초`:''}`:`${s}초`;
const dk=id=>`wk:done:${dkey}:${id}`;
function render(){
  $('#date').textContent=`${now.getMonth()+1}월 ${now.getDate()}일 ${WD[wd]}요일`;
  $('#tabs').innerHTML=[1,2,3,4,5].map(d=>`<button data-d="${d}" aria-pressed="${d===sel}" class="${d===wd?'today':''}">${WD[d]}</button>`).join('');
  if(!sel){$('#dtitle').textContent='오늘은 휴식일';$('#dsub').textContent='주말엔 쉬고 월요일에 하체 A로 시작해요';$('#bar').style.width='0';$('#ptext').textContent='';
    $('#list').innerHTML='<div class="rest"><h2>푹 쉬세요</h2><p>근육은 쉬는 동안 자랍니다. 가벼운 산책이나 스트레칭은 좋아요. 위에서 요일을 누르면 그날 운동을 미리 볼 수 있어요.</p></div>';return}
  const D=DAYS[sel];let tot=0,dn=0;
  $('#dtitle').textContent=D.t;$('#dsub').textContent=`${WD[sel]}요일 · ${D.s}${sel!==wd?' (미리보기)':''}`;
  const cards=D.i.map((it,i)=>{
    const id=`${sel}-${i}`,done=store.get(dk(id),[]),w=store.get('wk:w:'+id,'');
    const cnt=done.filter(Boolean).length;tot+=it.s;dn+=Math.min(cnt,it.s);const all=cnt>=it.s;
    const dots=it.s===1?`<button class="dot wide ${done[0]?'on':''}" data-set="${id}" data-k="0">${done[0]?'완료':'완료 체크'}</button>`
      :Array.from({length:it.s},(_,k)=>`<button class="dot ${done[k]?'on':''}" data-set="${id}" data-k="${k}" aria-label="${k+1}세트">${k+1}</button>`).join('');
    const yt='https://www.youtube.com/results?search_query='+encodeURIComponent(it.n.replace(' / 네거티브','')+' 자세');
    return `<article class="card ${all?'ok':''}"><div class="row1"><span class="no">${all?'✓':i+1}</span><div class="nm"><h3>${it.n}</h3><p>${it.r}${it.rest?` · 휴식 ${fmt(it.rest)}`:''}</p></div></div>
    <div class="row2">${it.w?`<label class="wt"><input inputmode="decimal" data-w="${id}" value="${esc(w)}" placeholder="무게" aria-label="${it.n} 무게"><span>kg</span></label>`:''}<div class="sets">${dots}</div></div>
    <button class="more" data-more="${id}" aria-expanded="${open.has(id)}">${open.has(id)?'자세 접기':'자세 영상 보기'}</button>
    ${open.has(id)?`<div class="det"><div class="fig" data-fig="${id}"><svg viewBox="0 0 220 200" data-m="${it.m}" data-id="${id}" role="img" aria-label="${it.n} 동작 애니메이션"></svg><span class="hint">${reduce?'탭하여 재생':'탭하여 멈춤'} · 빨간 부위에 집중</span></div>
    <dl><dt>자세</dt><dd>${it.p}</dd><dt>집중</dt><dd>${it.c}</dd><dt>잘못하면</dt><dd>${it.x}</dd></dl>
    <a class="yt" href="${yt}" target="_blank" rel="noopener">실제 영상 찾아보기 (YouTube)</a></div>`:''}</article>`}).join('');
  let sess='';
  if(AN&&sel===wd){const act=AN.sessionActive();
    sess=`<button class="watch ${act?'on':''}" id="sessBtn">${act?'워치 연동 중 · 운동 끝내기':'워치로 운동 시작'}</button><p class="wmsg">${wmsg||(act?'워치 알림에서 [세트 완료]를 누르세요. 휴식이 끝나면 워치가 진동해요.':'시작하면 워치에 현재 운동과 [세트 완료] 버튼이 떠요.')}</p>`}
  $('#list').innerHTML=`${sess}<p class="note">시작 전 5분 워밍업: 러닝머신 빠르게 걷기</p>${cards}`;
  $('#bar').style.width=(tot?dn/tot*100:0)+'%';$('#ptext').textContent=sel===wd?`오늘 ${dn} / ${tot}세트 완료`:'다른 요일은 미리보기예요. 체크는 오늘 날짜로 기록됩니다.'}
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-fig]');if(!b)return;
  if(b.dataset.d){sel=+b.dataset.d;render();scrollTo({top:0});return}
  if(b.id==='sessBtn'){if(AN.sessionActive()){AN.endSession();wmsg=''}else{const D=DAYS[sel];
    const plan={title:D.t,items:D.i.map((it,i)=>({id:`${sel}-${i}`,n:it.n,s:it.s,rest:it.rest,r:it.r,w:!!it.w}))};
    wmsg=AN.startSession(JSON.stringify(plan))?"설정 화면에서 '알람 및 리마인더'를 켜고 돌아오세요. 휴식 진동이 정확해져요.":''}
    render();return}
  if(b.dataset.more){const id=b.dataset.more;open.has(id)?open.delete(id):open.add(id);render();return}
  if(b.dataset.fig){const id=b.dataset.fig,s=b.querySelector('svg');if(reduce){s.dataset.play?delete s.dataset.play:s.dataset.play='1'}else{paused.has(id)?paused.delete(id):paused.add(id)}return}
  if(b.dataset.set){const id=b.dataset.set,k=+b.dataset.k,[d,i]=id.split('-').map(Number),it=DAYS[d].i[i],done=store.get(dk(id),[]);
    done[k]=!done[k];store.set(dk(id),done);if(done[k]&&it.rest)startTimer(it.rest,`${it.n} 휴식`);render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.w)store.set('wk:w:'+t.dataset.w,t.value)});

/* ---------- 휴식 타이머 ---------- */
let tEnd=0,tId=0,hideId=0;
function tick(){const left=Math.ceil((tEnd-Date.now())/1000),el=$('#timer');
  if(left<=0){clearInterval(tId);el.classList.add('done');$('#tval').textContent='다음 세트!';try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}hideId=setTimeout(stop,5000);return}
  $('#tval').textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`}
function startTimer(sec,label){try{AN&&AN.startRest(sec)}catch(e){}clearInterval(tId);clearTimeout(hideId);tEnd=Date.now()+sec*1000;$('#tlab').textContent=label;const el=$('#timer');el.hidden=false;el.classList.remove('done');tick();tId=setInterval(tick,250)}
function stop(){if(Date.now()<tEnd){try{AN&&AN.cancelRest()}catch(e){}}clearInterval(tId);clearTimeout(hideId);$('#timer').hidden=true}
$('#tplus').addEventListener('click',()=>{if(Date.now()>tEnd)tEnd=Date.now();tEnd+=30000;clearTimeout(hideId);$('#timer').classList.remove('done');clearInterval(tId);tick();tId=setInterval(tick,250)});
$('#tstop').addEventListener('click',stop);
render();requestAnimationFrame(frame);
if(AN){/* 워치에서 체크하면 열려 있는 화면도 따라 바뀐다 */
  const typing=()=>document.activeElement&&document.activeElement.tagName==='INPUT';
  let lv=AN.kvVersion();
  setInterval(()=>{if(document.hidden)return;const v=AN.kvVersion();if(v!==lv){lv=v;if(!typing())render()}},1500);
  window.__resync=()=>{lv=AN.kvVersion();if(!typing())render()};
}
if(window.Android){
  const box=$('#remind'),on=$('#ron'),tm=$('#rtime'),msg=$('#rmsg');box.hidden=false;
  try{const r=JSON.parse(Android.getReminder());on.checked=r.on;tm.value=String(r.h).padStart(2,'0')+':'+String(r.m).padStart(2,'0')}catch(e){}
  const save=()=>{const [h,m]=(tm.value||'18:00').split(':').map(Number);Android.setReminder(on.checked,h,m);msg.textContent=on.checked?`평일 ${tm.value}에 알려드릴게요.`:'알림을 껐어요.'};
  on.addEventListener('change',save);tm.addEventListener('change',save);
  $('#rtest').addEventListener('click',()=>{Android.testReminder();msg.textContent='알림이 안 보이면 휴대폰 설정에서 이 앱의 알림을 허용해 주세요.'});
}
}
</script>
</body>
</html>
